[package]
name = "durable-clickhouse-backup"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
k8s-openapi = { version = "0.28", features = ["v1_32"] }
kube = { version = "4.2", features = ["derive", "runtime"] }
rdkafka = { version = "0.38", features = ["dynamic-linking", "ssl", "sasl"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
schemars = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[dev-dependencies]
pretty_assertions = "1.4"
