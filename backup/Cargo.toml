[package]
name = "durable-clickhouse-backup"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3.34"
futures-util = "0.3.34"
rdkafka = { version = "0.38", features = ["dynamic-linking", "ssl", "sasl"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1.18", features = ["serde"] }

[dev-dependencies]
pretty_assertions = "1.4"
async-trait = "0.1"
libc = "0.2"
tempfile = "3"
tokio = { version = "1.47", features = ["fs", "process"] }

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
