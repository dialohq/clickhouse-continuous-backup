name: Publish image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: accept-flake-config = true
      - name: Build and push image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/durable-clickhouse-registry-auth.json
        run: |
          trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
          printf '%s' "$GITHUB_TOKEN" | nix run --inputs-from . nixpkgs#skopeo -- \
            login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          nix run .#connectImage.copyToRegistry
