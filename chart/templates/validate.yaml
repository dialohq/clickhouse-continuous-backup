{{- $names := dict -}}
{{- $topics := dict -}}
{{- $errorSettings := list "errors.tolerance" "errors.deadletterqueue.topic.name" "errors.deadletterqueue.topic.replication.factor" "errors.deadletterqueue.context.headers.enable" -}}
{{- $reserved := list "connector.class" "tasks.max" "topics" "topics.regex" "topic2TableMap" "hostname" "port" "ssl" "database" "username" "password" "exactlyOnce" "bufferCount" "consumer.override.group.id" "consumer.override.isolation.level" "zkPath" "zkDatabase" -}}
{{- range $pipeline := .Values.pipelines }}
{{- if hasKey $names $pipeline.name }}
{{- fail (printf "pipeline names must be unique: %s" $pipeline.name) }}
{{- end }}
{{- $_ := set $names $pipeline.name true }}
{{- if hasKey $topics $pipeline.topic }}
{{- fail (printf "topic names must be unique across pipelines: %s" $pipeline.topic) }}
{{- end }}
{{- $_ := set $topics $pipeline.topic true }}
{{- range $key, $_ := default dict $pipeline.connectorConfig }}
{{- if has $key $errorSettings }}
{{- fail (printf "pipeline %s must configure %s through connect.errors instead of connectorConfig" $pipeline.name $key) }}
{{- end }}
{{- if has $key $reserved }}
{{- fail (printf "pipeline %s cannot override safety-critical connector setting %s" $pipeline.name $key) }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.backup.enabled (not .Values.pauseServer.enabled) }}
{{- fail "backup.enabled requires pauseServer.enabled: the backup pauses ingestion through the pause server" }}
{{- end }}
{{- range $name := list "clickhouse" "backup" "recovery" "pauseServer" }}
{{- $config := index $.Values $name }}
{{- if and (or (ne $name "backup") $.Values.backup.enabled) (or (ne $name "pauseServer") $.Values.pauseServer.enabled) }}
{{- if eq (empty $config.credentialsFile) (empty $config.credentialsSecret.name) }}
{{- fail (printf "set exactly one of %s.credentialsFile or %s.credentialsSecret.name" $name $name) }}
{{- end }}
{{- end }}
{{- end }}
{{- /* On SIGTERM the backup resumes at most one outstanding pause through a single /resume call. */}}
{{- $minimumResumeGrace := add (int .Values.backup.pauseTimeoutSeconds) (int .Values.timeouts.connectRequestSeconds) }}
{{- if le (int .Values.backup.terminationGracePeriodSeconds) (int $minimumResumeGrace) }}
{{- fail "backup.terminationGracePeriodSeconds must exceed backup.pauseTimeoutSeconds plus timeouts.connectRequestSeconds" }}
{{- end }}
{{- range $segment := splitList "/" (trimSuffix "/" .Values.backup.pathPrefix) }}
{{- if or (eq $segment "") (eq $segment ".") (eq $segment "..") }}
{{- fail "backup.pathPrefix must be a relative object path without empty, . or .. segments" }}
{{- end }}
{{- end }}
